<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelador - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="glass-container login-box">
        <div class="logo">
            <span class="logo-icon">🏢</span>
            <h2>Zelador</h2>
            <p>Controle de Portaria Inteligente</p>
        </div>
        <form id="login-form">
            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" required placeholder="Digite seu usuário">
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="Digite sua senha">
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
            <div id="login-error" class="error-msg" style="display: none;">Credenciais inválidas.</div>
        </form>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/ui.js"></script>
</body>
</html>
